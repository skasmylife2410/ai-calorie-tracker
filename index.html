<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>SnapCal</title>
  <meta name="theme-color" content="#F7F6F3" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="SnapCal" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
  <link rel="stylesheet" href="/css/theme.css" />
  <link rel="stylesheet" href="/css/us.css" />
    <link rel="stylesheet" href="/css/app.css" />
  <link rel="preload" href="/vendor/fonts/instrument-serif/instrument-serif-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
  <style>
    /* The opening (js/intro.js). Inline so it's on screen before anything else loads.
       Same paper and ink as the app; colour only on the protein / carbs / fat markers. */
    @font-face { font-family: "Instrument Serif"; font-style: normal; font-weight: 400; font-display: swap;
      src: url(/vendor/fonts/instrument-serif/instrument-serif-latin-400-normal.woff2) format("woff2"); }
    #intro { position: fixed; inset: 0; z-index: 10000; background: #F7F6F3; overflow: hidden;
      display: grid; place-items: center; transition: opacity .7s ease, transform .7s cubic-bezier(.2,.7,.2,1), filter .7s ease; }
    #intro .intro-fluid { position: absolute; inset: -2%; opacity: 0; transform: scale(1.04); transition: opacity .7s ease, transform 2.4s cubic-bezier(.2,.7,.2,1); }
    #intro.intro-fluid-in .intro-fluid { opacity: 1; transform: scale(1); }
    #intro .intro-fluid canvas { width: 100% !important; height: 100% !important; display: block; }
    #intro::after { content: ""; position: absolute; inset: 0; pointer-events: none;
      background: radial-gradient(60% 26% at 50% 50%, rgba(247,246,243,.9) 0%, rgba(247,246,243,.5) 60%, rgba(247,246,243,0) 100%); }
    #intro .intro-mark { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; gap: 12px; color: #000; }
    #intro .intro-word { display: flex; font: 400 clamp(60px, 19vw, 84px)/1 "Instrument Serif", "New York", Georgia, serif; letter-spacing: -.02em; }
    #intro .intro-word span { display: inline-block; clip-path: inset(0 0 -.12em 0); padding-bottom: .12em; margin-bottom: -.12em; }
    #intro .intro-word i { display: inline-block; font-style: normal; transform: translateY(115%); }
    #intro .intro-line { width: 0; height: 1px; background: currentColor; }
    #intro .intro-tag { display: flex; gap: 14px; font: 500 13px/1 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; color: rgba(0,0,0,.6); opacity: 0; }
    #intro .intro-tag span { display: flex; align-items: center; gap: 6px; }
    #intro .intro-tag b { width: 6px; height: 6px; border-radius: 50%; transform: scale(0); }
    #intro.intro-playing .intro-word i { animation: intro-rise .9s cubic-bezier(.2,.8,.2,1) forwards; animation-delay: calc(var(--i) * 45ms + 150ms); }
    #intro.intro-playing .intro-line { animation: intro-line .9s cubic-bezier(.6,0,.2,1) .55s forwards; }
    #intro.intro-playing .intro-tag { animation: intro-fade .6s ease .95s forwards; }
    #intro.intro-playing .intro-tag b { animation: intro-pop .45s cubic-bezier(.3,1.6,.5,1) forwards; animation-delay: calc(var(--i) * 110ms + 1.1s); }
    #intro.intro-leaving { opacity: 0; transform: scale(1.03); filter: blur(6px); pointer-events: none; }
    @keyframes intro-rise { to { transform: translateY(0); } }
    @keyframes intro-line { to { width: 96px; } }
    @keyframes intro-fade { to { opacity: 1; } }
    @keyframes intro-pop { to { transform: scale(1); } }
    @media (prefers-reduced-motion: reduce) {
      #intro .intro-word i, #intro .intro-tag b { transform: none; }
      #intro .intro-line { width: 96px; }
      #intro .intro-tag { opacity: 1; }
      #intro.intro-playing * { animation: none !important; }
      #intro, #intro .intro-fluid { transition-duration: .25s; }
    }
  </style>
</head>
<body>
  <div id="intro" aria-hidden="true">
    <div class="intro-fluid"></div>
    <div class="intro-mark">
      <div class="intro-word"><span><i style="--i:0">S</i><i style="--i:1">n</i><i style="--i:2">a</i><i style="--i:3">p</i><i style="--i:4">C</i><i style="--i:5">a</i><i style="--i:6">l</i></span></div>
      <div class="intro-line"></div>
      <div class="intro-tag"><span><b style="--i:0;background:#E85D5D"></b>Snap</span><span><b style="--i:1;background:#E5A054"></b>Log</span><span><b style="--i:2;background:#6B8DE3"></b>Live</span></div>
    </div>
  </div>
  <div id="app-root"></div>
  <div id="modal-root"></div>
  <script type="module" src="/js/intro.js"></script>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
