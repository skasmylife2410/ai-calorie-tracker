<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>SnapCal</title>
  <meta name="theme-color" content="#F7F6F3" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="SnapCal" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
  <script src="/js/theme-boot.js"></script>
  <script src="/js/boot-guard.js"></script>
  <link rel="stylesheet" href="/css/theme.css" />
  <link rel="stylesheet" href="/css/us.css" />
  <link rel="stylesheet" href="/css/app.css" />
  <link rel="stylesheet" href="/css/mono.css" />
  <style>
    /* The opening (js/intro.js). Inline so it's on screen before anything else loads:
       the pearl flow and the SnapCal flame, nothing else. */
    #intro { position: fixed; inset: 0; z-index: 10000; background: #F7F6F3; overflow: hidden;
      display: grid; place-items: center; transition: opacity .7s ease, transform .7s cubic-bezier(.2,.7,.2,1), filter .7s ease; }
    #intro .intro-fluid { position: absolute; inset: -2%; opacity: 0; transform: scale(1.04); transition: opacity .7s ease, transform 2.4s cubic-bezier(.2,.7,.2,1); }
    #intro.intro-fluid-in .intro-fluid { opacity: 1; transform: scale(1); }
    #intro .intro-fluid canvas { width: 100% !important; height: 100% !important; display: block; }
    #intro::after { content: ""; position: absolute; inset: 0; pointer-events: none;
      background: radial-gradient(40% 22% at 50% 50%, rgba(247,246,243,.85) 0%, rgba(247,246,243,0) 100%); }
    #intro .intro-flame { position: relative; z-index: 1; width: clamp(72px, 22vw, 96px); height: auto; color: #000;
      opacity: 0; transform: translateY(14px) scale(.86); }
    #intro.intro-playing .intro-flame { animation: intro-flame 1s cubic-bezier(.2,.8,.2,1) .2s forwards; }
    #intro.intro-leaving { opacity: 0; transform: scale(1.03); filter: blur(6px); pointer-events: none; }
    @keyframes intro-flame { to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) {
      #intro .intro-flame { opacity: 1; transform: none; }
      #intro.intro-playing * { animation: none !important; }
      #intro, #intro .intro-fluid { transition-duration: .25s; }
    }
  </style>
</head>
<body>
  <div id="intro" aria-hidden="true">

  </div>
  <div id="app-root"></div>
  <div id="modal-root"></div>
  <script type="module" src="/js/intro.js"></script>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
